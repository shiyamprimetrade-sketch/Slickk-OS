name: P0-017 media and network benchmark validation

on:
  pull_request:
    paths:
      - 'media/**'
      - 'networking/**'
      - '.github/workflows/p017-media-network.yml'
  push:
    branches:
      - 'task/P0-017-media-network-benchmarks'
    paths:
      - 'media/**'
      - 'networking/**'
      - '.github/workflows/p017-media-network.yml'

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m compileall -q media/tools media/tests
      - name: Run synthetic-only regression suite
        run: python3 -m unittest discover -s media/tests -p 'test_*.py' -v
      - name: Check labeled synthetic report
        run: |
          python3 media/tools/bench.py media/fixtures/synthetic_pairs.json > /tmp/p017-report.json
          python3 -c 'import json; r=json.load(open("/tmp/p017-report.json")); assert r["valid"] and not r["claim_allowed"] and r["dataset_kinds"] == ["synthetic"]'
